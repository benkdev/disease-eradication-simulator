name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Check code formatting
        run: pnpm format:check

      - name: Run Engine unit tests
        run: pnpm test:engine

      - name: Run Web unit tests
        run: pnpm test:web

      - name: Build packages
        run: pnpm build

      - name: Install Playwright Chromium & dependencies
        run: pnpm --filter @tld/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Generate Allure Report
        if: always()
        run: pnpm allure:generate

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: apps/web/allure-report
          retention-days: 14

      - name: Upload Playwright Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 14
