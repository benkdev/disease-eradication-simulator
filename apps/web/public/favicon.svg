<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00C853" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Clean White Background with soft rounded corners -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF" />

  <!-- Subtle grid lines indicating scientific graph -->
  <line x1="12" y1="52" x2="52" y2="52" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="14" x2="12" y2="52" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

  <!-- Gradient Area Under Curve -->
  <path
    d="M 12 52 C 28 52, 42 45, 52 14 L 52 52 Z"
    fill="url(#areaGrad)"
  />

  <!-- Bright Green Exponential Curve Upward -->
  <path
    d="M 12 52 C 28 52, 42 45, 52 14"
    fill="none"
    stroke="url(#curveGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Apex Peak Marker Dot -->
  <circle cx="52" cy="14" r="4.5" fill="#00E676" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
